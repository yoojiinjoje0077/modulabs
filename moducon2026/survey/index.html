  job: { key: 'job', eyebrow: 'Q. 마지막 질문', title: '지금 어떤 일을 하고 계세요?', lead: '과정 안내를 더 잘 맞춰 드리기 위한 질문이에요.', opts: [
    { v: '사무·기획', e: '🗂️', t: '사무·기획·경영지원', go: 'contact' },
    { v: '마케팅·콘텐츠', e: '📣', t: '마케팅·영업·콘텐츠', go: 'contact' },
    { v: '개발·데이터', e: '💻', t: '개발·데이터', go: 'contact' },
    { v: '학생·취업 준비', e: '🎓', t: '학생·취업 준비', go: 'contact' },
    { v: '창업·자영업', e: '🏪', t: '창업·자영업·프리랜서', go: 'contact' },
    { v: '기타', e: '✨', t: '기타', go: 'contact' } ] },
};

/* ── 상태 ── */
const A = {};          // 답변
let hist = [];         // 지나온 화면
let cur = 'intro';

function remaining(id) {   // 남은 질문 수 추정 (진행 막대용)
  return ({ intro: 4, card: 4, goalA: 3, style: 4, pkgTopic: 2, field: 3, introTopic: 2, contentTopic: 2, workPick: 2, contentPick: 2, devPick: 2, job: 1, contact: 0 })[id] ?? 1;
}
function progress() {
  const bar = $('#bar');
  bar.hidden = cur === 'intro';
  const done = hist.filter(h => h !== 'intro').length;
  const total = done + remaining(cur) + 1;
  $('#fill').style.width = Math.round((done + (cur === 'contact' ? 0.6 : 0)) / total * 100) + '%';
  $('#count').textContent = cur === 'contact' ? '마지막' : `${done + 1} / ${total}`;
}

function go(id, push = true) {
  if (push && cur) hist.push(cur);
  cur = id;
  render();
  track('survey_step_view', { step: id, step_index: hist.length });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('#prev').addEventListener('click', () => {
  if (!hist.length) return;
  const back = hist.pop(); cur = back;
  // 되돌아간 화면 이후 답은 지움
  const keys = ['card','goal','style','topic','pick','course','job'];
  const k = S[back] && S[back].key; if (k) keys.slice(keys.indexOf(k)).forEach(x => delete A[x]);
  render(); track('survey_back', { step: back });
});

function render() {
  progress();
  const v = $('#view');
  if (cur === 'intro') {
    v.innerHTML = `<section class="screen">
      <p class="eyebrow">MODUCON 2026</p>
      <h1>1분 설문하고<br>AI 에이전트 받기</h1>
      <p class="lead">몇 가지만 고르면 나에게 맞는 AI 과정을 찾아 드리고, 콘텐츠 제작 AI 에이전트를 바로 받을 수 있어요.</p>
      <div class="gift"><small>설문 참여 선물</small><strong>콘텐츠 제작 AI 에이전트<br>+ 나에게 맞는 과정 안내</strong></div>
      <ol class="steps"><li><b>1</b>4~5개 질문에 탭으로 답하기</li><li><b>2</b>이름·휴대폰 번호 남기기</li><li><b>3</b>에이전트와 추천 과정을 문자로 받기</li></ol>
      <button class="btn pri" id="startBtn" type="button">시작하기</button></section>`;
    $('#startBtn').onclick = () => { track('survey_start'); go('card'); };
    return;
  }
  if (cur === 'contact') return renderContact();
  const s = S[cur];
  v.innerHTML = `<section class="screen">
    <p class="eyebrow">${esc(s.eyebrow)}</p><h2>${esc(s.title)}</h2>${s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ''}
    ${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}
    <div class="opts">${s.opts.map((o, i) => `<button class="opt${A[s.key] === o.v ? ' on' : ''}" type="button" data-i="${i}">
      <span class="em" aria-hidden="true">${o.e}</span><span class="tx"><span class="tt">${esc(o.t)}</span>${o.d ? `<span class="ds">${esc(o.d)}</span>` : ''}</span><span class="ar" aria-hidden="true">›</span></button>`).join('')}</div></section>`;
  v.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const o = s.opts[+b.dataset.i];
    b.classList.add('on');
    A[s.key] = o.v;
    if (o.course) A.course = o.course;
    track('survey_answer', { step: cur, answer: o.v });
    setTimeout(() => go(o.course ? 'job' : o.go), 160);
  }));
}

function renderContact() {
  const c = C[A.course];
  const openAlert = A.card === '있음' && c.type === 'new';
  $('#view').innerHTML = `<section class="screen">
    <p class="eyebrow">거의 다 됐어요</p><h2>결과를 받을 휴대폰 번호를 알려 주세요</h2>
    <p class="lead">추천 과정 안내와 AI 에이전트 다운로드 링크를 문자로 보내 드려요.</p>
    <div class="pick"><img src="${esc(c.thumb)}" alt=""><div><small>나에게 맞는 과정</small><b>${esc(c.label || c.name)}</b></div></div>
    <form id="cform" novalidate>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="field"><label class="label" for="name">이름<span class="req">*</span></label><input type="text" id="name" autocomplete="name" maxlength="30"></div>
      <div class="field"><label class="label" for="phone">휴대폰 번호<span class="req">*</span></label><input type="tel" id="phone" autocomplete="tel" inputmode="numeric" maxlength="13" placeholder="010-0000-0000"></div>
      ${openAlert ? `<div class="consent hl"><label class="check"><input type="checkbox" id="openAlert"><span>국비지원으로 열리면 연락받기<em>선택한 과정이 자동으로 기록돼요</em></span></label></div>` : ''}
      <div class="consent"><label class="check"><input type="checkbox" id="privacy"><span>[필수] 개인정보 수집·이용 동의</span></label>
        <details><summary>내용 보기</summary><table>
          <tr><th>수집 항목</th><td>이름, 휴대폰 번호, 설문 응답</td></tr>
          <tr><th>이용 목적</th><td>설문 결과·AI 에이전트 안내 문자 발송${openAlert ? ', 국비지원 오픈 안내' : ''}</td></tr>
          <tr><th>보유 기간</th><td>수집일로부터 1년 (이후 지체 없이 파기)</td></tr></table>
          동의를 거부할 수 있으며, 거부 시 결과 문자를 받을 수 없어요.</details></div>
      <div class="consent"><label class="check"><input type="checkbox" id="marketing"><span>[선택] 교육 과정·할인 소식 수신 동의<em>모두콘 특별 할인 등 소식을 문자로 받아요</em></span></label>
        <details><summary>내용 보기</summary><table>
          <tr><th>수집 항목</th><td>이름, 휴대폰 번호</td></tr><tr><th>이용 목적</th><td>교육 과정, 할인·이벤트 안내 (문자)</td></tr><tr><th>보유 기간</th><td>동의 철회 시까지</td></tr></table></details></div>
      <p class="error" id="err" role="alert"></p>
      <button class="btn pri" id="submitBtn" type="submit">결과 받기</button>
    </form></section>`;
  const phone = $('#phone');
  phone.addEventListener('input', () => {
    const d = phone.value.replace(/\D/g, '').slice(0, 11);
    phone.value = d.length < 4 ? d : d.length < 8 ? d.slice(0,3) + '-' + d.slice(3) : d.slice(0,3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4);
  });
  $('#cform').addEventListener('submit', submit);
}

async function submit(e) {
  e.preventDefault();
  const name = $('#name').value.trim(), phone = $('#phone').value.trim();
  const err = !name ? '이름을 입력해 주세요.' : !/^01\d{8,9}$/.test(phone.replace(/\D/g, '')) ? '휴대폰 번호를 확인해 주세요.' : !$('#privacy').checked ? '개인정보 수집·이용에 동의해 주세요.' : '';
  $('#err').textContent = err; if (err) return;
  const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = '결과 만드는 중…';
  const c = C[A.course];
  const data = Object.assign({
    action: 'survey', card: A.card, style: A.style || '프리캠', goal: A.goal || '', topic: A.topic || A.pick || '',
    courseId: A.course, courseName: c.name, courseType: c.type, job: A.job || '',
    name, phone, privacy: true, marketing: $('#marketing').checked, openAlert: !!($('#openAlert') && $('#openAlert').checked),
    website: document.querySelector('input[name=website]').value,
  }, utm);
  let res;
  try {
    if (DEMO) { await new Promise(r => setTimeout(r, 600)); res = { ok: true, sms: 'demo' }; }
    else res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) })).json();
  } catch (x) { res = { ok: false, error: 'network' }; }
  if (!res.ok) {
    btn.disabled = false; btn.textContent = '결과 받기';
    $('#err').textContent = res.error === 'invalid' ? '입력 내용을 다시 확인해 주세요.' : '연결이 불안정해요. 잠시 후 다시 눌러 주세요.';
    track('survey_submit_error', { reason: res.error || 'unknown' });
    return;
  }
  track('survey_submit', { course_id: A.course, course_type: c.type, card: A.card, style: data.style, job: data.job,
    open_alert: data.openAlert ? 'Y' : 'N', marketing_opt_in: data.marketing ? 'Y' : 'N', sms: res.sms || '', duration_sec: Math.round((Date.now() - startedAt) / 1000) });
  const q = new URLSearchParams({ c: A.course, k: A.card === '있음' ? '1' : A.card === '없음' ? '0' : '2', o: data.openAlert ? '1' : '0', s: res.sms === 'sent' ? '1' : '0', from: 'survey' });
  location.href = RESULT_PATH + '?' + q.toString();
}

if (DEMO) $('#demoNote').hidden = false;
render();
</script>
</body>
</html>
