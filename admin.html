<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDC-KDT CRM 관리자</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="adminFrame" src="./admin-main.html" title="KDC-KDT CRM 관리자"></iframe>

  <script>
    const frame = document.getElementById("adminFrame");

    frame.addEventListener("load", function () {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const topbar = doc.querySelector(".topbar");
        const logoutButton = doc.getElementById("logoutButton");

        if (!topbar || !logoutButton || doc.getElementById("visitorAdminLink")) {
          return;
        }

        const actionGroup = doc.createElement("div");
        actionGroup.style.display = "flex";
        actionGroup.style.alignItems = "center";
        actionGroup.style.gap = "8px";
        actionGroup.style.marginLeft = "auto";

        const visitorLink = doc.createElement("a");
        visitorLink.id = "visitorAdminLink";
        visitorLink.href = "./admin-visitors.html";
        visitorLink.textContent = "CRM 링크 방문 고객";
        visitorLink.className = "logout-btn";
        visitorLink.style.textDecoration = "none";
        visitorLink.style.color = "#111827";
        visitorLink.style.display = "inline-flex";
        visitorLink.style.alignItems = "center";
        visitorLink.style.justifyContent = "center";
        visitorLink.style.whiteSpace = "nowrap";

        topbar.removeChild(logoutButton);
        actionGroup.appendChild(visitorLink);
        actionGroup.appendChild(logoutButton);
        topbar.appendChild(actionGroup);
      } catch (error) {
        console.error("관리자 상단 메뉴 연결 실패", error);
      }
    });
  </script>
</body>
</html>
